name: Semantic release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: services/tileserver_api
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Create semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: services/tileserver_api
        run: npx --yes semantic-release@25.0.9

      - name: Find release tag created for this commit
        id: release_tag
        working-directory: services/tileserver_api
        run: |
          TAG="$(git tag --points-at HEAD --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.release_tag.outputs.tag != ''
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.release_tag.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        if: steps.release_tag.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/services/tileserver_api
          file: ${{ github.workspace }}/services/tileserver_api/docker/Dockerfile
          target: production
          push: true
          build-args: VERSION=${{ steps.release_tag.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/tileserver:${{ steps.release_tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/tileserver:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release_tag.outputs.tag }}
